
name: Build Journal SMP Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle executable
        working-directory: Journal-SMP-GitHub-Build-Ready
        run: chmod +x gradlew

      - name: Compile Minecraft mod
        working-directory: Journal-SMP-GitHub-Build-Ready
        run: ./gradlew build --no-daemon

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: Journal-SMP-Fabric-Mod
          path: |
            Journal-SMP-GitHub-Build-Ready/build/libs/journalsmp-*.jar
            !Journal-SMP-GitHub-Build-Ready/build/libs/*-sources.jar
          if-no-files-found: error

